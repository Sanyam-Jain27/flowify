version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Database (PostgreSQL)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: flowify-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowify"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Message Broker (Apache Kafka with KRaft - No Zookeeper needed)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: flowify-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  # ----------------------------------------------------------------------------
  # 3. Primary Backend API (:3010)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flowify-backend
    restart: always
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/flowify?schema=public"
      JWT_PASSWORD: "flowify-super-secret-jwt-key"
      PORT: 3010
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Webhook Ingestion Service (:3011)
  # ----------------------------------------------------------------------------
  hooks:
    build:
      context: .
      dockerfile: docker/Dockerfile.hooks
    container_name: flowify-hooks
    restart: always
    ports:
      - "3011:3011"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/flowify?schema=public"
      HOOKS_PORT: 3011
      PORT: 3011
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Outbox Processor Service
  # ----------------------------------------------------------------------------
  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    container_name: flowify-processor
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/flowify?schema=public"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_CLIENT_ID: "outbox-processor"
      KAFKA_TOPIC: "zap-events"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 6. Kafka Action Workers Service
  # ----------------------------------------------------------------------------
  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    container_name: flowify-workers
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/flowify?schema=public"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_CLIENT_ID: "action-worker"
      KAFKA_TOPIC: "zap-events"
      KAFKA_CONSUMER_GROUP: "flowify-worker-dev-v2"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASS: "${EMAIL_PASS:-}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 7. Frontend Next.js Web UI (:3000)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3010/api/v1}
        NEXT_PUBLIC_HOOKS_URL: ${NEXT_PUBLIC_HOOKS_URL:-http://localhost:3011/hooks/catch}
    container_name: flowify-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

